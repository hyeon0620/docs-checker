name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [develop, main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            あなたは docs-checker（社内向け日本語メール校正アプリ、15人規模）のプルリクエストをレビューしています。
            リポジトリルートの CLAUDE.md と docs/architecture.md を読み、プロジェクトのコンテキストとレビューガイドラインを把握してください。

            **すべてのレビューコメントは日本語で記述してください。**

            以下の観点で徹底的なコードレビューを行ってください：

            1. **正確性・ロジック**
               - PR の説明通りにコードが動作するか？
               - ロジックエラー、off-by-one バグ、見落としたエッジケースはないか？
               - 非同期パターン（await、エラー伝播）は正しく使われているか？

            2. **セキュリティ**
               - SQL インジェクション、XSS、コマンドインジェクションのリスク
               - 認証・認可のバイパスの可能性（Cookie / JWT / SameSite / HttpOnly）
               - コード内のシークレットや認証情報
               - システム境界での入力バリデーション

            3. **アーキテクチャ・規約（CLAUDE.md より）**
               - **コードの並び順**：主役 → 内部ヘルパーの順、機能ごとにセクション見出し（# === xxx ===）
               - **docstring**：「〇〇時：何をする」形式の1行。内部から呼ばれるヘルパーは「呼び出し元 内」と明記
               - **ファイル分割**：スキーマ等が3個までは同居、4個以上で別ファイル
               - **不要なコメントは書かない**（self-explanatory な what は不要、why が非自明な時のみ）

            4. **設計判断との一貫性**
               - architecture.md の方針通りか？（校正結果を永続化しない、認証は JWT + HttpOnly Cookie、Gemini-2.5-flash-lite、等）
               - ptw-respec を真似しすぎて過剰な抽象化になってないか？（このアプリは 15 人規模）

            5. **テスト**
               - 新機能はテストでカバーされているか？
               - エッジケース、認証失敗パス、空入力などはテストされているか？
               - LLM 呼び出しは dependency_overrides で mock されているか？（実 Gemini を呼ばないこと）

            具体的な問題にはインラインコメントで明確な説明と修正案を記述してください。
            全体的な評価はトップレベルのサマリーコメントにまとめてください。
            建設的なレビューを心がけ、良いパターンも認めてください。問題点だけを指摘しないこと。
            生成ファイル、ロックファイル、ドキュメントのみの変更はエラーがない限りスキップしてください。

          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model claude-opus-4-7
            --max-turns 100
